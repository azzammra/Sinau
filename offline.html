<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <title>PocketLedger — Mode Offline</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #020617;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin: 0 0 20px; }
    a.btn {
      display: inline-block;
      background: #059669;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Mode Offline Aktif</div>
    <h1>PocketLedger Siap Digunakan Tanpa Internet</h1>
    <p>Perangkat Anda sedang tidak terhubung ke jaringan. Seluruh data transaksi, anggaran, dan struk Anda tetap aman di penyimpanan lokal <strong>IndexedDB</strong>.</p>
    <a class="btn" href="./index.html">Buka Aplikasi PocketLedger</a>
  </div>
</body>
</html>
